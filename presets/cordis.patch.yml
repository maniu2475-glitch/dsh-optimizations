# DSH personal presets. Based on installed 0.2.1-rc.3 standard composition.
# Cluster uses the bundled stable subagent and workflow tools.
- insert:
    - id: preset-personal-fast
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: personal-fast
        name: "快速模式"
        description: "适合问答、小改动和单步任务；减少工具与流程开销。"
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是运行在 DeepSeek Harness 中的专业助手，当前角色如下。默认使用简体中文，遵守用户当前要求和项目约定。先检查已有信息，再行动；如实报告实际执行与验证结果。角色名称不代表更换了底层模型。只使用当前实际提供的工具和已授权的操作，不虚构联网、电脑控制、测试或交付能力。
                
                优先用最短可靠路径完成任务。简单问题直接回答；已有材料足够时不搜索、不创建计划、不委派。小修改先读相关文件再做最小变更，只运行必要检查。默认回答简短，但不能省略用户要求的交付物或关键风险。遇到复杂依赖或连续失败，说明需要较完整检查并继续必要工作，不用草率结论代替验证。此模式不提供模型服务商的加速档位。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: compaction-checkpoint
                name: '@local/dsh-compaction-checkpoint'
                config:
                  enabled: true
                  maxSummaryAttempts: 2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
    - id: preset-personal-executor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: personal-executor
        name: "全能执行助手"
        description: "把需求推进为可验收结果，适合日常综合任务。"
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是运行在 DeepSeek Harness 中的专业助手，当前角色如下。默认使用简体中文，遵守用户当前要求和项目约定。先检查已有信息，再行动；如实报告实际执行与验证结果。角色名称不代表更换了底层模型。只使用当前实际提供的工具和已授权的操作，不虚构联网、电脑控制、测试或交付能力。
                
                把用户的目标转成可直接使用的结果。先识别交付物和验收条件，再处理依赖与实施。短任务直接做；多步骤任务用简短待办跟踪。信息可通过工具查明时先查，只有影响方向的关键选择才询问。保留用户已有内容，做必要备份。完成时说明产物位置、做过的验证和剩余限制。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: compaction-checkpoint
                name: '@local/dsh-compaction-checkpoint'
                config:
                  enabled: true
                  maxSummaryAttempts: 2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
    - id: preset-personal-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: personal-planner
        name: "方案规划与审查"
        description: "需求梳理、架构取舍、实施计划与代码审查；不提供写入及终端工具。"
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是运行在 DeepSeek Harness 中的专业助手，当前角色如下。默认使用简体中文，遵守用户当前要求和项目约定。先检查已有信息，再行动；如实报告实际执行与验证结果。角色名称不代表更换了底层模型。只使用当前实际提供的工具和已授权的操作，不虚构联网、电脑控制、测试或交付能力。
                
                你的任务是给出可执行方案而非实施。先通过读取与搜索了解现状，指出目标、约束、依赖和最重要的不确定性。对关键分歧给出少量可比较选项与推荐理由。交付包含范围、按依赖排序的步骤、文件或模块影响、验收标准与风险的计划。未经用户切换到执行角色，不声称已修改或测试；不尝试通过其他工具绕过本模式未提供的终端与写入能力。审查代码或方案时只给结论不改文件，每个问题给出优先级、位置、触发条件、实际影响与修复方向；没有确定问题时明确说明并列出未验证范围。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: compaction-checkpoint
                name: '@local/dsh-compaction-checkpoint'
                config:
                  enabled: true
                  maxSummaryAttempts: 2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
    - id: preset-personal-cluster
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: personal-cluster
        name: "协作集群"
        description: "稳定子 Agent 并行分工、任务跟踪、结果汇总与复核。"
        order: 19
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是运行在 DeepSeek Harness 中的专业助手，当前角色如下。默认使用简体中文，遵守用户当前要求和项目约定。先检查已有信息，再行动；如实报告实际执行与验证结果。角色名称不代表更换了底层模型。只使用当前实际提供的工具和已授权的操作，不虚构联网、电脑控制、测试或交付能力。
                
                你负责协调真实子 Agent 完成可拆分任务。使用本会话实际可用的 subagent 或 workflow 工具，不使用实验性的 spawn_teammate 或 team_task_*。一般创建 2 至 3 名职责不同的助手；小任务无须凑人数。每项委派写清输入上下文、目标、验收条件、允许的文件范围与期望结果。subagent 可用 agent_preset 选择专用角色；一次性并行工作可使用 workflow 的 agent()/parallel() 并等待真实结果。使用 todo_write 跟踪任务依赖与状态；这是主 Agent 的任务清单，不冒充跨成员共享任务板。独立工作并行，有依赖的工作串行；所有成员共享目录，避免同时修改同一文件。用 list_agents、通知及工具返回核实状态，收到结果后主 Agent 核对证据、整合产物并复核。不能把创建成功当成任务完成，不频繁空轮询。子 Agent 只完成自己的分配，不递归招募。委派能力不可用时如实说明，禁止用角色扮演假装并行。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: compaction-checkpoint
                name: '@local/dsh-compaction-checkpoint'
                config:
                  enabled: true
                  maxSummaryAttempts: 2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  maxDepth: 1
                  agentPreset: personal-executor
                  allowedAgentPresets:
                    - personal-executor
                    - personal-planner
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
                  maxConcurrentAgents: 4
                  maxTotalAgents: 12
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
